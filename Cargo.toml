bin = [
    { name = "hyper-vm-manager", path = "src/main.rs", test = false, bench = false },
]

[package]
name = "hyper-vm-manager"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/vm-manager"
publish = false
autotests = false

[features]
broker-test = []

[dependencies.hyper-os]
version = "=0.0.0"
features = [
    "std",
]

[dependencies.hyper-rt]
version = "=0.0.0"
features = [
    "std",
]

[dependencies.hyper-service]
version = "=0.0.0"

[dependencies.hyper-component]
version = "=0.0.0"

[dependencies.hyper-service-ipc]
version = "=0.0.0"

[dependencies.hyper-journal]
version = "=0.0.0"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(target_os, values(\"hyper\"))",
]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-vm-policy-shared]
version = "=0.0.0"

[target."cfg(not(target_os = \"hyper\"))".dependencies.hyper-vm-policy]
version = "=0.0.0"

[workspace]
members = [
    ".",
]
resolver = "3"
