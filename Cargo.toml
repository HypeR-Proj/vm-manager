[package]
workspace = "../../app"
name = "hyper-vm-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Unit-test modules live in tests/ and are included by their owning library.
autotests = false

[[bin]]
name = "hyper-vm-manager"
path = "src/main.rs"
test = false
bench = false

[features]
broker-test = []

[dependencies]
hyper-os = { workspace = true, features = ["std"] }
hyper-rt.workspace = true
hyper-service.workspace = true
hyper-component.workspace = true
hyper-service-ipc.workspace = true
hyper-journal.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "hyper")'.dependencies]
hyper-vm-policy-shared.workspace = true

[target.'cfg(not(target_os = "hyper"))'.dependencies]
hyper-vm-policy.workspace = true
